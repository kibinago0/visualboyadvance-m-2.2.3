name: Visual Studio
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        msvc_arch: [x64]
        cmake_generator: [Ninja]
        cmake_build: ['-DCMAKE_BUILD_TYPE=Release']
        cmake_vcpkg_triplet: [x64-windows-static]
    runs-on: windows-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure
        run: >-
          cmake -B build -G ${{ matrix.cmake_generator }} -DVCPKG_TARGET_TRIPLET=${{ matrix.cmake_vcpkg_triplet }} -DENABLE_XAUDIO2=OFF ${{ matrix.cmake_build }}

      - name: Build
        run: cmake --build build --parallel

      - name: Locate executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path build -Filter visualboyadvance-m.exe -Recurse -File | Select-Object -First 1
          if (-not $executable) {
            throw 'visualboyadvance-m.exe was not produced'
          }
          Write-Host "Found executable at $($executable.FullName)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualboyadvance-m-windows-x64
          path: build/**/visualboyadvance-m.exe
          if-no-files-found: error

      # Run tests
      - name: Run tests
        run: cd build && ctest -j --output-on-failure
